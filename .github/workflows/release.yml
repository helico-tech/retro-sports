name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - name: Package
        run: |
          mkdir -p dist/retro-sports
          cp target/release/retro-sports README.md dist/retro-sports/
          tar -C dist -czf retro-sports-linux-x86_64.tar.gz retro-sports
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: retro-sports-linux-x86_64.tar.gz

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release --target aarch64-apple-darwin
      - run: cargo build --release --target x86_64-apple-darwin
      - name: Package universal app
        run: |
          APP="dist/Retro Sports.app"
          mkdir -p "$APP/Contents/MacOS"
          lipo -create -output "$APP/Contents/MacOS/retro-sports" \
            target/aarch64-apple-darwin/release/retro-sports \
            target/x86_64-apple-darwin/release/retro-sports
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          sed "s/__VERSION__/$VERSION/" packaging/Info.plist > "$APP/Contents/Info.plist"
          codesign --force --deep -s - "$APP"
          cd dist && ditto -c -k --keepParent "Retro Sports.app" ../RetroSports-macos.zip
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: RetroSports-macos.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/retro-sports | Out-Null
          Copy-Item target/release/retro-sports.exe, README.md dist/retro-sports/
          Compress-Archive -Path dist/retro-sports -DestinationPath retro-sports-windows-x86_64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: retro-sports-windows-x86_64.zip

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Not a tag: builds are attached to this run as artifacts only."
            exit 0
          fi
          gh release create "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" \
            --title "Retro Sports $TAG" --generate-notes
