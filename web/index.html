<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DODGE OR DIE!</title>
<meta name="description" content="A 16-bit style dodgeball game. 3 vs 3, four crews, four courts. Play in your browser with a keyboard.">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
</style>
</head>
<body>
<canvas id="glcanvas" tabindex="1"></canvas>
<script src="mq_js_bundle.js"></script>
<script>
  // keys only reach the game while the canvas has focus
  // (the loader already defines a global `canvas`)
  const game = document.getElementById("glcanvas");
  game.focus();
  window.addEventListener("pointerdown", () => game.focus());
  load("dodgeball.wasm");
</script>
</body>
</html>
